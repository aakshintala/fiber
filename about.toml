# The accepted list below carries the same set of licences as deny.toml
# [licenses] allow (docs/dependencies.md, "Supply chain"). A crate offered
# under several licences passes when one of them is on this list.
# scripts/check runs `cargo about generate` against this file on every pull
# request, so a dependency with a new licence fails the pull request, not
# the release.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "MPL-2.0",
]
