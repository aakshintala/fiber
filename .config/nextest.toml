# docs/testing.md, "Running tests": each test is killed past its timeout.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

# The delegate listing regression has a nested fake-server completion deadline
# of 90 s; 270 s leaves room for setup and bounded cleanup.
[[profile.default.overrides]]
filter = 'package(main) & test(=delegates::delegate_models_omits_logged_out_provider_references)'
slow-timeout = { period = "30s", terminate-after = 9 }

# cargo-mutants' profile (.cargo/mutants.toml): the first failure stops every
# running test, so a test that would hang until its deadline does not turn a
# caught mutant into a timeout.
[profile.mutants]
fail-fast = { max-fail = 1, terminate = "immediate" }

# docs/ci.md, "On every pull request that changes code": the stress job runs
# nextest under this profile, so a selected test fails instead of passing
# on retry, and the selected tests share every core.
[profile.stress]
inherits = "default"
retries = 0
test-threads = "num-cpus"

# docs/ci.md, "On every pull request that changes code": the test job runs
# nextest under this profile, so a failed binary-level test retries once.
# kind(test) is the integration-test binaries: the single-file ones
# (crates/main/tests/*.rs) and the area ones (crates/main/tests/<area>/main.rs,
# which cargo discovers as one test target each); the unit tests in
# crates/main/src/ are kind(bin) and never retry.
[profile.ci]
inherits = "default"

[[profile.ci.overrides]]
filter = 'package(main) & kind(test)'
retries = 1

[profile.ci.junit]
path = "junit.xml"

# docs/tools.md, "Size budget in CI": the built-in definition sizes are printed on every run, a pass included.
[[profile.default.overrides]]
filter = 'package(main) & test(=builtin::tool_budget_tests::the_built_in_definitions_fit_their_budget)'
success-output = "immediate"

# docs/testing.md, "Journeys": the journey binary's kill bound is twice the
# longest single deadline plus run time; it carries only slow-timeout, so a
# hang fails once under the default profile. Longest deadline 120 s, moved
# journey ~6 s local run: 2×120 + 7 rounds to 9 periods (270 s).
[[profile.default.overrides]]
filter = 'package(main) & binary(=main_journeys)'
slow-timeout = { period = "30s", terminate-after = 9 }

# docs/testing.md, "Waits and timeouts": the frame-locked click proofs'
# kill bound is twice the longest single deadline plus run time; the proofs
# carry only slow-timeout, so a hang fails under this override instead of
# the default profile. Longest deadline 80 s, proofs ~ms local run:
# 2×80 + ms rounds to 9 periods (270 s).
[[profile.default.overrides]]
filter = 'package(main) & (test(=support_helpers::wait_screen_panics_with_the_checked_grid_and_names_the_deadline_left) | test(=support_helpers::wait_screen_leading_puts_the_lead_before_the_wait_and_the_screen) | test(=support_helpers::shows_row_matches_a_whole_trimmed_row_only) | test(=support_helpers::workspace_cleanup_wait_uses_the_cleanup_phase) | test(=support_helpers::a_click_found_before_a_row_is_inserted_lands_on_the_target_row) | test(=support_helpers::a_style_only_change_between_find_and_click_is_a_change) | test(=support_helpers::an_unchanged_frame_clicks_once_without_a_retry) | test(=support_helpers::an_absent_target_panics_naming_the_wait_and_the_last_grid) | test(=support_helpers::the_click_is_written_while_the_frame_lock_is_held) | test(=support_helpers::a_panicking_encoder_leaves_both_locks_usable) | test(=support_helpers::a_held_writer_sends_nothing_even_after_it_is_released) | test(=support_helpers::an_open_synchronized_frame_waits_for_its_close_then_refinds))'
slow-timeout = { period = "30s", terminate-after = 9 }
