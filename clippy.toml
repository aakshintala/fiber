allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

disallowed-methods = [
    { path = "std::sync::mpsc::Receiver::recv_timeout", reason = "receive through fakes::Deadline (docs/testing.md, \"Waits and timeouts\")" },
    { path = "std::thread::sleep", reason = "wait on an injected contract::clock::Clock" },
    { path = "std::time::Instant::now", reason = "read time from an injected contract::clock::Clock" },
    { path = "std::time::SystemTime::now", reason = "read time from an injected contract::clock::Clock" },
    { path = "std::time::Instant::elapsed", reason = "read time from an injected contract::clock::Clock" },
    { path = "std::time::SystemTime::elapsed", reason = "read time from an injected contract::clock::Clock" },
    { path = "support::clock::Manual::advance", reason = "advance to a named park through advance_when_parked (docs/testing.md, \"Waits and timeouts\")" },
    { path = "support::clock::Manual::advance_marked", reason = "advance to a named park through advance_when_parked (docs/testing.md, \"Waits and timeouts\")" },
]
