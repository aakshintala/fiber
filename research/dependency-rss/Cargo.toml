[package]
name = "dependency-rss"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: never part of Fiber's workspace.
[workspace]

# One feature per candidate crate. run.sh builds each alone and compares
# its peak RSS with the build that has no features.
[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"], optional = true }
ratatui = { version = "0.30", default-features = false, optional = true }
crossterm = { version = "0.29", optional = true }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
mlua = { version = "0.11", features = ["lua54", "vendored"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
thiserror = { version = "2", optional = true }
signal-hook = { version = "0.3", optional = true }
getrandom = { version = "0.3", optional = true }
base64 = { version = "0.22", optional = true }
ring = { version = "0.17", optional = true }
rustix = { version = "1", features = ["pty", "fs", "process", "termios"], optional = true }
regex = { version = "1", optional = true }
ignore = { version = "0.4", optional = true }
grep-searcher = { version = "0.1", optional = true }
grep-regex = { version = "0.1", optional = true }
similar = { version = "2", optional = true }
html5ever = { version = "0.40", optional = true }
encoding_rs = { version = "0.8", optional = true }
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
jsonschema = { version = "0.33", default-features = false, optional = true }
arborium = { version = "2.18", features = ["lang-bash", "lang-c", "lang-cpp", "lang-css", "lang-diff", "lang-go", "lang-html", "lang-java", "lang-javascript", "lang-json", "lang-markdown", "lang-python", "lang-rust", "lang-sql", "lang-toml", "lang-tsx", "lang-typescript", "lang-yaml"], optional = true }
syntect = { version = "5", default-features = false, features = ["default-fancy"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
zune-jpeg = { version = "0.5", optional = true }
jpeg-encoder = { version = "0.7", default-features = false, optional = true }
png = { version = "0.18", optional = true }
gif = { version = "0.14", default-features = false, features = ["std"], optional = true }
image-webp = { version = "0.2", optional = true }
fast_image_resize = { version = "6", optional = true }

[features]
image = ["dep:image"]
# The four codecs and a resizer as separate crates, without the image crate.
image-parts = ["dep:zune-jpeg", "dep:jpeg-encoder", "dep:png", "dep:gif", "dep:image-webp", "dep:fast_image_resize"]
# image crate decode/encode; fast_image_resize (with its `image` feature) for Lanczos3 resize.
image-fir = ["dep:image", "dep:fast_image_resize", "fast_image_resize/image"]
# Header-only dimensions via image::ImageReader (no pixel decode).
image-header = ["dep:image"]
serde_json = ["dep:serde", "dep:serde_json"]
jsonschema = ["dep:jsonschema", "dep:serde_json"]
# Built-in shell search: ripgrep's walker, regex adapter and search loop.
search = ["ignore", "dep:grep-searcher", "dep:grep-regex"]
# web_fetch: html5ever's tokenizer feeding Fiber's own single-pass writer.
html5ever = ["dep:html5ever"]
# The terminal's syntax highlighting: tree-sitter grammars for the
# languages the terminal highlights, loaded on first use.
arborium = ["dep:arborium"]
# web_fetch: decoding pages by their declared character set.
encoding_rs = ["dep:encoding_rs"]

[profile.release]
lto = "thin"
strip = true
