[package]
name = "dependency-rss"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: never part of Fiber's workspace.
[workspace]

# One feature per candidate crate. run.sh builds each alone and compares
# its peak RSS with the build that has no features.
[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"], optional = true }
ratatui = { version = "0.30", default-features = false, optional = true }
crossterm = { version = "0.29", optional = true }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
mlua = { version = "0.11", features = ["lua54", "vendored"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
thiserror = { version = "2", optional = true }
signal-hook = { version = "0.3", optional = true }
getrandom = { version = "0.3", optional = true }
base64 = { version = "0.22", optional = true }
ring = { version = "0.17", optional = true }
rustix = { version = "1", features = ["pty", "fs", "process", "termios"], optional = true }
regex = { version = "1", optional = true }
ignore = { version = "0.4", optional = true }
grep-searcher = { version = "0.1", optional = true }
grep-regex = { version = "0.1", optional = true }
similar = { version = "2", optional = true }
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
jsonschema = { version = "0.33", default-features = false, optional = true }
syntect = { version = "5", default-features = false, features = ["default-fancy"], optional = true }

[features]
serde_json = ["dep:serde", "dep:serde_json"]
jsonschema = ["dep:jsonschema", "dep:serde_json"]
# Built-in shell search: ripgrep's walker, regex adapter and search loop.
search = ["ignore", "dep:grep-searcher", "dep:grep-regex"]

[profile.release]
lto = "thin"
strip = true
