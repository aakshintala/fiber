name: probe-130
on: push
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -yq time
      - run: rustup update stable && rustup default stable
      - run: research/image-limits/linux-probe/probe.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: out-${{ matrix.os }}
          path: out
