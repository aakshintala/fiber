[package]
name = "rss-probe"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
mlua = { version = "0.12", features = ["lua54", "vendored"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "1"
serde = "1"
serde_json = "1"

[profile.release]
strip = true
