[package]
name = "fakes"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Of Fiber's crates, `fakes` may depend only on `contract` and `support`
# (docs/architecture.md, "The call rules"): every crate may depend on
# `support`, which holds no domain knowledge. ring computes credential
# fingerprints; the scripted provider implements contract's provider seam.
[dependencies]
contract = { path = "../contract" }
support = { path = "../support" }
ring = "0.17"
rustix.workspace = true
# gzip for the release fixtures `ustar` builds.
flate2.workspace = true
serde_json.workspace = true

# The jig (docs/testing.md, "Jigs"). `test = true` runs its own tests with the
# crate's.
[[example]]
name = "provider-server"
test = true

[lints]
workspace = true
