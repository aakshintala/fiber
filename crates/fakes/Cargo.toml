[package]
name = "fakes"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Of Fiber's crates, `fakes` may depend only on `contract`
# (docs/architecture.md, "The call rules"). The provider server needs only std;
# the scripted provider implements contract's provider seam.
[dependencies]
contract = { path = "../contract" }

[dev-dependencies]
serde_json.workspace = true

# The jig (docs/testing.md, "Jigs"). `test = true` runs its own tests with the
# crate's.
[[example]]
name = "provider-server"
test = true

[lints]
workspace = true
