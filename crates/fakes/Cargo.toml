[package]
name = "fakes"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Of Fiber's crates, `fakes` may depend only on `contract` and `support`
# (docs/architecture.md, "The call rules"): every crate may depend on
# `support`, which holds no domain knowledge. The scripted provider
# implements contract's provider seam.
[dependencies]
contract = { path = "../contract" }
support = { path = "../support" }
rustix.workspace = true
# gzip for the release fixtures `ustar` builds.
flate2.workspace = true
serde_json.workspace = true

# The jig (docs/testing.md, "Jigs"): a binary jig tested by
# `tests/provider_server_jig.rs`, which runs the built binary.
[[example]]
name = "provider-server"

[lints]
workspace = true
