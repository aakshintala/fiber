[package]
name = "fakes"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Contract-free helpers depend only on `support` in the workspace
# (docs/architecture.md, "The call rules").
[dependencies]
support = { path = "../support" }
rustix.workspace = true
# gzip for the release fixtures `ustar` builds.
flate2.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
libc = "0.2"

# The jig (docs/testing.md, "Jigs"): a binary jig tested by
# `tests/provider_server_jig.rs`, which runs the built binary.
[[example]]
name = "provider-server"

[lints]
workspace = true
