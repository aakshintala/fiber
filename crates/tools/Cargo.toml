[package]
name = "tools"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Of Fiber's crates, `tools` depends on `contract` and `net`
# (docs/architecture.md, "The call rules"); `support` holds no domain
# knowledge, so every crate may depend on it. thiserror names each tool
# failure as its own case (`docs/errors.md`, "Where a code comes from").
[dependencies]
config = { path = "../config" }
contract = { path = "../contract" }
net = { path = "../net" }
support = { path = "../support" }
encoding_rs.workspace = true
grep-regex.workspace = true
grep-matcher.workspace = true
grep-searcher.workspace = true
html5ever.workspace = true
ignore.workspace = true
rustix.workspace = true
serde_json.workspace = true
serde.workspace = true
similar.workspace = true
thiserror.workspace = true
tree-sitter.workspace = true
tree-sitter-bash.workspace = true
ureq.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
seccompiler.workspace = true
libc.workspace = true

[dev-dependencies]
fakes = { path = "../fakes" }
proptest.workspace = true

# The jig (docs/testing.md, "Jigs").
[[example]]
name = "call"

[lints]
workspace = true
