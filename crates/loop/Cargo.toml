publish.workspace = true

# `loop` depends on `contract`, `log` and the three seams, which live in
# `contract` (docs/architecture.md, "The call rules"), and on `support`,
# which holds no domain knowledge and sits outside the call rules.
[dependencies]
base64.workspace = true
contract = { path = "../contract" }
log = { path = "../log" }
rustix.workspace = true
support = { path = "../support" }
serde_json.workspace = true
similar.workspace = true
thiserror.workspace = true

[dev-dependencies]
fakes = { path = "../fakes" }
# The mid-`jobs wait` cancel test enters the production `JobsTool::wait`
# on a real registry.
jobs = { path = "../jobs" }
proptest.workspace = true

