[package]
name = "net"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# `net` depends on `contract`, shared support mechanisms and ureq's TLS stack
# (docs/architecture.md, "The call rules").
[dependencies]
contract = { path = "../contract" }
support = { path = "../support" }
thiserror.workspace = true
ureq.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = { version = "0.7", default-features = false }
webpki-roots = { version = "1", default-features = false }
ring.workspace = true
base64.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustls-native-certs = "0.8"

[dev-dependencies]
fakes = { path = "../fakes" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[lints]
workspace = true
