[package]
name = "tui"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
contract = { path = "../contract" }
log = { path = "../log" }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
ignore.workspace = true
pulldown-cmark.workspace = true
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
rustix.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
similar.workspace = true
support = { path = "../support" }
thiserror.workspace = true

[dev-dependencies]
fakes = { path = "../fakes" }
insta.workspace = true
proptest.workspace = true

# The `draw` jig has no unit tests of its own: `crates/tui/tests/draw_jig.rs`
# runs the built jig as a child (`docs/testing.md`, "Jigs"), so the example
# stays a runnable binary.
[[example]]
name = "draw"

# The paging jig has no unit tests of its own: `crates/tui/tests/paging_open.rs`
# runs the built jig as a child (`docs/testing.md`, "Jigs"), so the example
# stays a runnable binary.
[[example]]
name = "paging"
test = false

# The `hover` jig has no unit tests of its own: `crates/tui/tests/hover_jig.rs`
# runs the built jig as a child (`docs/testing.md`, "Jigs"), so the example
# stays a runnable binary.
[[example]]
name = "hover"

[lints]
workspace = true
