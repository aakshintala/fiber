[package]
name = "support"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# `support` depends on nothing in the workspace (docs/architecture.md, "The call rules").
[dependencies]
ring.workspace = true
rustix.workspace = true
thiserror.workspace = true

# macOS only: the peer process id and the PROC_PIDT_SHORTBSDINFO/KERN_PROCARGS2
# process reads behind support::peer. Linux reads /proc with std::fs instead.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[features]
test-hooks = []

[dev-dependencies]
support = { path = ".", features = ["test-hooks"] }
fakes = { path = "../fakes" }

[lints]
workspace = true
