[package]
name = "provider"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# `provider` depends on `contract` and `net`
# (docs/architecture.md, "The call rules"), and on `support`, which holds
# no domain knowledge and sits outside the call rules.
[dependencies]
base64.workspace = true
contract = { path = "../contract" }
net = { path = "../net" }
support = { path = "../support" }
serde_json.workspace = true
thiserror.workspace = true
ureq.workspace = true

[dev-dependencies]
fakes = { path = "../fakes" }

# The jigs (docs/testing.md, "Jigs"). `test = true` runs the record jig's own tests.
[[example]]
name = "decode"

[[example]]
name = "record"
path = "examples/record/main.rs"
test = true

[lints]
workspace = true
