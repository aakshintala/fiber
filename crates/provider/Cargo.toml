[package]
name = "provider"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# `provider` depends on `contract` and `net`
# (docs/architecture.md, "The call rules"), and on `support`, which holds
# no domain knowledge and sits outside the call rules.
[dependencies]
base64.workspace = true
contract = { path = "../contract" }
net = { path = "../net" }
support = { path = "../support" }
serde_json.workspace = true
thiserror.workspace = true
ureq.workspace = true
ring.workspace = true

[features]
test-hooks = []

[dev-dependencies]
fakes = { path = "../fakes" }
provider = { path = ".", features = ["test-hooks"] }

# The jigs (docs/testing.md, "Jigs"): binary jigs. `decode` has no unit
# tests of its own; `record`'s are in `tests/support/record.rs`, run inside
# `tests/record_jig.rs`, which runs the built binary.
[[example]]
name = "decode"

[[example]]
name = "record"
path = "examples/record/main.rs"

[lints]
workspace = true
