[package]
name = "mcp"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Of Fiber's crates, `mcp` depends only on `contract`, `support` and
# `net` (docs/architecture.md, "The call rules"). serde derives the server
# JSON types, serde_json carries the wire format, thiserror the error
# enums, base64 decodes binary content, ring the OAuth PKCE challenge and
# random, rustix
# the process-group signals, `support` lists every server's process group,
# and ureq carries streamable HTTP through `net`'s connector.
[dependencies]
contract = { path = "../contract" }
support = { path = "../support" }
net = { path = "../net" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
ring.workspace = true
rustix.workspace = true
ureq.workspace = true

[dev-dependencies]
fakes = { path = "../fakes" }

[lints]
workspace = true
