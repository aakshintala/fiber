[package]
name = "mcp"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Of Fiber's crates, `mcp` depends only on `contract` and `support`
# (docs/architecture.md, "The call rules"). serde derives the server JSON
# types, serde_json carries the wire format, thiserror the error enums,
# ring the tool-name hash, rustix the process-group signals, and `support`
# lists every server's process group.
[dependencies]
contract = { path = "../contract" }
support = { path = "../support" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ring = "0.17"
rustix.workspace = true

[dev-dependencies]
fakes = { path = "../fakes" }

[lints]
workspace = true
