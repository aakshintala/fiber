[package]
name = "mcp"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Of Fiber's crates, `mcp` depends only on `contract`
# (docs/architecture.md, "The call rules"). serde derives the server JSON
# types, serde_json carries the wire format, thiserror the error enums,
# and ring the tool-name hash.
[dependencies]
contract = { path = "../contract" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ring = "0.17"
rustix.workspace = true

[dev-dependencies]
fakes = { path = "../fakes" }

[lints]
workspace = true
