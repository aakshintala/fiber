[workspace]
members = ["crates/config", "crates/contract", "crates/doors", "crates/extensions", "crates/fakes", "crates/jobs", "crates/log", "crates/loop", "crates/main", "crates/mcp", "crates/picture", "crates/provider", "crates/tools", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
proptest = "1"
proc-macro2 = "1"
pulldown-cmark = { version = "0.13", default-features = false }
mlua = { version = "0.12", features = ["lua54", "vendored"] }
rustix = { version = "1", features = ["process", "pty"] }
similar = { version = "2", default-features = false, features = ["text"] }
ignore = "0.4"
grep-searcher = "0.1"
grep-matcher = "0.1"
grep-regex = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
fast_image_resize = { version = "6", features = ["image"] }
base64 = "0.22"

# The lints in docs/code-quality.md, "Lints". Every crate inherits them with
# `lints.workspace = true`.
[workspace.lints.rust]
unknown_lints = "deny"
renamed_and_removed_lints = "deny"
unreachable_patterns = "deny"
unreachable_pub = "deny"
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
unchecked_time_subtraction = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
iter_over_hash_type = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"

# docs/code-quality.md, "Panics".
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
overflow-checks = true
