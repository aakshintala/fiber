name: TUI demo binaries

# Builds the two Linux binaries for the tui-prototype demo package
# (research/tui-prototype/demo). Manual only: the demo is assembled by hand
# with research/tui-prototype/demo/package.sh, never on a push or a pull
# request.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add the musl target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        working-directory: research/tui-prototype
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke test
        run: |
          set -eu
          bin="research/tui-prototype/target/${{ matrix.target }}/release/tui-prototype"
          file "$bin"
          file "$bin" | grep -qiE "statically linked|static-pie linked" || {
            echo "::error::$bin is not statically linked"
            exit 1
          }
          script -qec "$bin research/tui-prototype/fixtures/session.jsonl --static --exit-after 2" /dev/null

      - name: Stage the binary for upload
        run: |
          mkdir -p dist
          cp "research/tui-prototype/target/${{ matrix.target }}/release/tui-prototype" \
             "dist/tui-prototype-linux-${{ matrix.arch }}"

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tui-prototype-linux-${{ matrix.arch }}
          path: dist/tui-prototype-linux-${{ matrix.arch }}
