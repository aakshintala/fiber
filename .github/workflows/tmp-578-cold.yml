name: tmp-578-cold
on:
  pull_request:
    paths: [.github/workflows/tmp-578-cold.yml]
permissions:
  contents: read
jobs:
  cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: |
          uname -a; lscpu | head -20; df -hT / /mnt; (command -v fincore || ls -l /usr/bin/fincore /usr/sbin/fincore /sbin/fincore || true); (dpkg -s util-linux | grep Version || true)
          sudo mkdir -p /mnt/fiber-session-search
          sudo chown "$USER" /mnt/fiber-session-search
          CORPUS=/mnt/fiber-session-search bash research/session-search/run.sh
          cat research/session-search/results.tsv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results
          path: research/session-search/results.tsv
