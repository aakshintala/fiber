name: Scheduled

# docs/ci.md, "Advisories", "Toolchain" and "The break-glass audit".
on:
  schedule:
    - cron: "17 6 * * *" # advisories, daily
    - cron: "41 6 * * 1" # toolchain bump, weekly
    - cron: "53 6 * * *" # break-glass audit, daily
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  advisories:
    name: Advisories on main
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *'
    runs-on: ubuntu-24.04
    # Median 17 s; floor.
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny
      - name: cargo deny check advisories
        run: cargo deny check advisories 2>&1 | tee deny.txt
      - name: Open or comment on the advisory issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: An advisory applies to main
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          { echo "cargo-deny's advisory check failed on main at $GITHUB_SHA: $RUN_URL"; echo; echo '```'; tail -c 60000 deny.txt; echo '```'; } >body.md
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            -q "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi

  toolchain:
    name: Bump the toolchain
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 6 * * 1'
    runs-on: ubuntu-24.04
    # One run, 8 s (curl, sed and git, no build); floor.
    timeout-minutes: 5
    # A pull request opened with the default token starts no workflow, so
    # this job pushes and opens the pull request with a token that does.
    env:
      GH_TOKEN: ${{ secrets.TOOLCHAIN_BUMP_TOKEN }}
    steps:
      - name: Require the token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The TOOLCHAIN_BUMP_TOKEN secret is not set, so the bump pull request would not run CI"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.TOOLCHAIN_BUMP_TOKEN }}
      - name: Open a pull request if a newer stable release exists
        run: |
          latest=$(curl -fsSL https://static.rust-lang.org/dist/channel-rust-stable.toml \
            | sed -n '/^\[pkg\.rust\]/{n;s/^version = "\([0-9.]*\) .*/\1/p;}')
          current=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "pinned: $current; newest stable: $latest"
          if [ -z "$latest" ] || [ "$latest" = "$current" ]; then
            exit 0
          fi
          branch="toolchain/$latest"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
            echo "$branch already exists"
            exit 0
          fi
          sed -i "s/^channel = \".*\"/channel = \"$latest\"/" rust-toolchain.toml
          sed -i "s/pins the exact Rust version, $current\./pins the exact Rust version, $latest./" docs/ci.md
          git diff --exit-code --quiet docs/ci.md && { echo "::error::docs/ci.md does not name $current"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "Bump the Rust toolchain to $latest"
          git push origin "$branch"
          gh pr create --head "$branch" --title "Bump the Rust toolchain to $latest" \
            --body "Pins Rust $latest, the newest stable release, in rust-toolchain.toml and docs/ci.md (docs/ci.md, \"Toolchain\")."

  break-glass-audit:
    name: break-glass audit
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '53 6 * * *'
    runs-on: ubuntu-24.04
    # No history; a gh API walk of 48 h of commits; generous bound.
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain
        run: rustup toolchain install
      # The step only fetches: every decision is in
      # `cargo xtask break-glass-audit` (xtask/src/break_glass_audit.rs).
      # A lookup that `gh` or `jq` could not complete is passed on as
      # {"ok": false}, which the audit treats as an error.
      - name: List merges with no green CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now=$(date +%s)
          since=$(cargo xtask break-glass-audit --since --now "$now")
          dir=$(mktemp -d)
          lookup() {
            local body
            if body=$(gh api "$@") && printf '%s\n' "$body" | jq -c '{ok: true, body: .}'; then
              return 0
            fi
            echo '{"ok":false}'
          }
          lookup --paginate --slurp "repos/$GITHUB_REPOSITORY/commits?sha=main&since=$since&per_page=100" >"$dir/commits.json"
          for sha in $(jq -r '(.body // [])[] | .[] | .sha' "$dir/commits.json"); do
            lookup --paginate "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" | jq -c --arg k "$sha" '{key: $k, value: .}'
          done | jq -s -c 'from_entries' >"$dir/pulls.json"
          for head in $(jq -r '[.[] | (.body // [])[]? | .head.sha? // empty] | unique[]' "$dir/pulls.json"); do
            lookup "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?check_name=CI&filter=latest&per_page=100" | jq -c --arg k "$head" '{key: $k, value: .}'
          done | jq -s -c 'from_entries' >"$dir/checks.json"
          jq -n -c --slurpfile commits "$dir/commits.json" --slurpfile pulls "$dir/pulls.json" --slurpfile checks "$dir/checks.json" \
            '{commits: $commits[0], pulls: $pulls[0], checks: $checks[0]}' |
            cargo xtask break-glass-audit --now "$now"
