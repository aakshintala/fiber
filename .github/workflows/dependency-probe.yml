name: Dependency probe

# Runs research/dependency-rss/run.sh, the per-crate memory probe of
# docs/dependencies.md ("Measuring memory"), on the three runner types. Manual
# only: `gh workflow run dependency-probe.yml --ref <branch>`, never on a push
# or a pull request. The ref is the only input.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.runner }}
    # No history yet; generous until a few runs set a median.
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the probe
        run: sh research/dependency-rss/run.sh | tee probe.md

      - name: Upload the table
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-probe-${{ matrix.runner }}
          path: probe.md
