name: tmp-dep-rss
on:
  push:
    branches: [release/413-install-sh]
permissions:
  contents: read
jobs:
  rss:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain
        run: rustup toolchain install
      - name: Measure
        run: sh research/dependency-rss/run.sh | tee "$GITHUB_STEP_SUMMARY"
