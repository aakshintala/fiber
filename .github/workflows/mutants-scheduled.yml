name: Scheduled whole-workspace mutants

# docs/ci.md, "On every pull request that changes code" and "Job time limits".
on:
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: mutants-scheduled
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Every apt-get call retries and gives up on a silent mirror.
  APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20

defaults:
  run:
    shell: bash

jobs:
  baseline:
    name: Workspace baseline
    runs-on: ubuntu-24.04
    # Generous initial bound for a whole-workspace baseline with no scheduled cold-run history.
    timeout-minutes: 360
    steps:
      - name: Checkout scheduled SHA
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the toolchain
        timeout-minutes: 10
        run: rustup toolchain install
      - name: Restore the build cache
        timeout-minutes: 5
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          save-if: false
      - name: Install cargo-nextest
        timeout-minutes: 5
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest
      - &shell-debs-key
        name: Key the zsh and fish archive cache
        id: shell-debs-key
        env:
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          if [ -z "${ImageOS:-}" ] || [ -z "${ImageVersion:-}" ]; then
            echo "ImageOS and ImageVersion must be set on the runner" >&2
            exit 1
          fi
          echo "key=shell-debs-$ImageOS-$ImageVersion-$RUNNER_ARCH-zsh-fish" >> "$GITHUB_OUTPUT"
      - &shell-debs-restore
        name: Restore the zsh and fish archives
        id: shell-debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/shell-debs
          key: ${{ steps.shell-debs-key.outputs.key }}
      - &install-shells
        name: Install zsh and fish
        timeout-minutes: 5
        run: scripts/install-shells "$RUNNER_TEMP/shell-debs"
      - &shell-debs-save
        name: Save the zsh and fish archives
        if: steps.shell-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/shell-debs
          key: ${{ steps.shell-debs-key.outputs.key }}
      - name: Run the workspace baseline
        timeout-minutes: 300
        run: cargo nextest run --workspace --no-fail-fast --profile ci

  list:
    name: List workspace mutants
    runs-on: ubuntu-24.04
    # The list resolves workspace metadata but runs no tests; the bound is
    # generous because scheduled cold-run history is not available.
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.rotation.outputs.matrix }}
    steps:
      - name: Checkout scheduled SHA
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the toolchain
        timeout-minutes: 10
        run: rustup toolchain install
      - name: Restore the build cache
        timeout-minutes: 5
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          save-if: false
      - name: Install cargo-mutants
        timeout-minutes: 5
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-mutants
      - name: Count mutants and pick this rotation day's shards
        id: rotation
        timeout-minutes: 15
        run: |
          count=$(cargo mutants --workspace --test-tool nextest --list | awk 'NF { n++ } END { print n + 0 }')
          epoch_day=$(( $(date -u +%s) / 86400 ))
          rotation=$(scripts/mutants-rotation "$count" "$epoch_day")
          matrix=$(jq -c '{shard: .shards, total: [.total], day: [.day]}' <<<"$rotation")
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          echo "Mutants: $count; rotation: $rotation." >>"$GITHUB_STEP_SUMMARY"

  mutants:
    name: Mutants (day ${{ matrix.day }} shard ${{ matrix.shard }}/${{ matrix.total }})
    needs: [baseline, list]
    runs-on: ubuntu-24.04
    # Generous initial bound for whole-workspace mutation testing with no scheduled cold-run history.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.list.outputs.matrix) }}
    steps:
      - name: Checkout scheduled SHA
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the toolchain
        timeout-minutes: 10
        run: rustup toolchain install
      - name: Restore the build cache
        timeout-minutes: 5
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          save-if: false
      - name: Install cargo-mutants and cargo-nextest
        timeout-minutes: 5
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-mutants,cargo-nextest
      - *shell-debs-key
      - *shell-debs-restore
      - *install-shells
      - *shell-debs-save
      - name: List and run workspace mutants
        timeout-minutes: 300
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
          ROTATION_DAY: ${{ matrix.day }}
        run: |
          mutant_list="$RUNNER_TEMP/mutants-scheduled-day$ROTATION_DAY-$SHARD-of-$TOTAL.txt"
          cargo mutants --workspace --test-tool nextest --shard "$SHARD/$TOTAL" --sharding round-robin --list >"$mutant_list"
          echo "Rotation day $ROTATION_DAY, shard $SHARD of $TOTAL (--shard $SHARD/$TOTAL, round-robin)." >>"$GITHUB_STEP_SUMMARY"
          if [ ! -s "$mutant_list" ]; then
            echo "no mutants in shard $SHARD"
            exit 0
          fi
          cat "$mutant_list"
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          state=""
          for _ in $(seq 1 30); do
            state=$(systemctl --user is-system-running 2>/dev/null || true)
            if [ "$state" = running ] || [ "$state" = degraded ]; then
              break
            fi
            sleep 1
          done
          if [ "$state" != running ] && [ "$state" != degraded ]; then
            echo "systemd's user instance is not running after 30 s: '$state'"
            exit 1
          fi
          mutant_args=(
            --workspace
            --test-tool nextest
            --baseline=skip
            --timeout 120
            --shard "$SHARD/$TOTAL"
            --sharding round-robin
          )
          # Guarded by `if` so errexit (-e, which Actions' `bash`
          # shell sets) does not exit on a non-zero status before the
          # status capture: a survivors-only shard (status 2) must reach
          # the helper below instead of failing the step here.
          if systemd-run --user --scope -p MemoryMax=12G -p OOMPolicy=kill -- cargo mutants "${mutant_args[@]}"; then
            status=0
          else
            status=$?
          fi
          if [ "$status" -ne 0 ]; then
            last_log=$(find mutants.out/log -type f -name '*.log' -printf '%T@ %p\n' 2>/dev/null \
              | sort -nr | head -n 1 | cut -d' ' -f2- || true)
            echo "cargo mutants failed with status $status; last mutant:"
            if [ -n "$last_log" ]; then
              awk 'NF { print; exit }' "$last_log"
            else
              echo "No scenario log found in mutants.out/log."
            fi
            scripts/mutants-shard-finish "$status"
          fi
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-scheduled-day${{ matrix.day }}-shard${{ matrix.shard }}-of${{ matrix.total }}
          path: mutants.out
          if-no-files-found: ignore
