name: Journey report (nightly)

# Reports the nightly's journey failures (docs/ci.md, "The journey suite").
# The nightly publish uploads the failures file; this workflow reads that
# artifact and files one issue per failing journey, through the same report
# step as main. It acts only on a successful nightly run: a skipped nightly
# uploads nothing, and the report writes nothing.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  journey_report:
    name: Report nightly journey failures
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.event == 'schedule'
        || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    # No history: it makes only gh calls.
    timeout-minutes: 5
    concurrency:
      group: journey-report
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      COMMIT: ${{ github.event.workflow_run.head_sha }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      # A skipped nightly uploads no failures file, and a stable release
      # never runs the suite: no match warns instead of failing, and the
      # report step below writes nothing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: journey-failures
          path: ${{ runner.temp }}/journey
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          if-no-files-found: warn
      - name: File or comment on the journey issues
        env:
          FAILURES: ${{ runner.temp }}/journey/journey-failures.txt
        run: |
          # The failing journey names, one per line; a missing or empty file
          # is a pass, so it writes nothing.
          lines=$(grep . "${FAILURES:?the journey failures file}" 2> /dev/null || true)
          if [ -z "$lines" ]; then
            echo "no journey failed: nothing to file" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # shellcheck disable=SC2001 # prefixing every line is not one substitution.
          listed=$(sed 's/^/- /' <<< "$lines")
          # The first open issue with exactly this title, never a pull
          # request. Prints the number or nothing; a failed lookup fails.
          open_number() {
            gh issue list --state open --search "in:title \"$1\"" --json number,title \
              -q "map(select(.title == \"$1\")) | .[0].number // empty"
          }
          while IFS= read -r name || [ -n "$name" ]; do
            [ -n "$name" ] || continue
            title="Journey failure: $name"
            # shellcheck disable=SC2016 # the backticks are literal markdown in the issue body; printf expands the %s.
            body=$(printf 'Journey `%s` failed at %s: %s\nFailing journeys in this run:\n%s' "$name" "$COMMIT" "$RUN_URL" "$listed")
            if number=$(open_number "$title"); then
              if [ -n "$number" ]; then
                gh issue comment "$number" --body "$body"
                continue
              fi
            else
              echo "the open-issue search for $title failed, so nothing is filed" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            # Recheck immediately before the create: another report may have
            # filed since the lookup, so a duplicate title fails closed.
            if number=$(open_number "$title"); then
              if [ -n "$number" ]; then
                gh issue comment "$number" --body "$body"
                continue
              fi
            else
              echo "the open-issue recheck for $title failed, so nothing is filed" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            gh issue create --title "$title" --body "$body" --label bug
          done <<< "$lines"
