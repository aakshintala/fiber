name: fsync measure (throwaway)
on:
  pull_request: {}
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest
      - name: Filesystem under TMPDIR
        run: df -hT "$RUNNER_TEMP"; uname -m; nproc
      - name: fsync cost per durable line
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          for i in 1 2 3; do
            cargo nextest run -p log --release --run-ignored only --no-capture fsync_cost
          done
