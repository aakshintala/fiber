name: CI

# docs/ci.md. Pull requests run what their diff selects. Every push to main
# runs the backstop, which runs every job the selection chooses and is the
# only run that saves the build cache.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]

# A newer push to a pull request cancels its older run. Any other pull
# request event at the same head (a label, a change from draft to ready, a
# reopen) waits behind the running run instead of cancelling it, then runs
# the whole selection again at that head; at most one run waits, and a newer
# event replaces it before it starts. Pushes to main share
# one group that cancels nothing: the running backstop finishes and the newest
# push waits behind it.
concurrency:
  group: ci-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Every apt-get call retries and gives up on a silent mirror.
  APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20

defaults:
  run:
    shell: bash

jobs:
  select:
    name: Selection
    runs-on: ubuntu-24.04
    # Median 44 s; the slowest passing run of the last 25 took 65 s, so the 5-minute
    # floor covers twice it (docs/ci.md, "Job time limits").
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      base: ${{ steps.base.outputs.base }}
      mode: ${{ steps.select.outputs.mode }}
      packages: ${{ steps.select.outputs.packages }}
      jobs: ${{ steps.plan.outputs.jobs }}
      shards: ${{ steps.plan.outputs.shards }}
      shard_total: ${{ steps.plan.outputs.shard_total }}
      shard_timeout: ${{ steps.plan.outputs.shard_timeout }}
      ten_turns: ${{ steps.plan.outputs.ten_turns }}
      base_skip: ${{ steps.plan.outputs.base_skip }}
    steps:
      - &checkout-full
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Find the base commit
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The merge ref's first parent is the main commit the run
            # merged onto. The event's base.sha can be older, and the diff
            # would then charge main's commits in between to the pull request.
            base=$(git rev-parse HEAD^1)
          else
            # The backstop compares against the last main commit whose
            # backstop passed. The release job's stored-results lookup (scripts/stored-results) is the only other Actions API call CI makes to find a run.
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              -q '.workflow_runs[0].head_sha // empty')
            if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" HEAD; then
              # No passing backstop yet: compare against the first commit,
              # which selects everything.
              base=$(git rev-list --max-parents=0 HEAD | tail -1)
            fi
          fi
          echo "base=$base" | tee -a "$GITHUB_OUTPUT"

      - &toolchain
        name: Install the toolchain
        run: rustup toolchain install

      # rust-cache's own key ignores Cargo.toml's [profile] tables, and it
      # reads no `key` input once `shared-key` is set, so the shared key names
      # the dev profile's generation: change it with the profile, here and in
      # the test job's step.
      - &cache-restore
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-line-tables
          save-if: false

      - name: Select
        id: select
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: cargo xtask select --base "$BASE" | tee -a "$GITHUB_OUTPUT"

      - name: Docs check
        if: github.event_name == 'pull_request'
        run: scripts/check-docs

      - name: Unsafe table
        run: cargo xtask unsafe-table

      - name: Dependency list
        run: cargo xtask dependency-list

      - name: Read the ticket's labels
        id: ticket
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          bug=false
          number=$(cargo xtask ticket <<<"$PR_BODY")
          if [ -n "$number" ]; then
            # A failed lookup fails the selection rather than skipping the
            # bug-fix check.
            labels=$(gh issue view "$number" --json labels -q '.labels[].name')
            if grep -qx bug <<<"$labels"; then
              bug=true
            fi
          fi
          echo "ticket: ${number:-none}; bug: $bug"
          echo "bug=$bug" >>"$GITHUB_OUTPUT"

      - name: Install cargo-mutants
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-mutants

      - name: Plan
        id: plan
        env:
          MODE: ${{ steps.select.outputs.mode }}
          PACKAGES: ${{ steps.select.outputs.packages }}
          DRAFT: ${{ github.event.pull_request.draft || 'false' }}
          BUG: ${{ steps.ticket.outputs.bug || 'false' }}
          BASE: ${{ steps.base.outputs.base }}
          # Mutants run on a ready pull request and on a draft labelled `mutants`,
          # never on the backstop.
          MUTANTS: ${{ github.event_name == 'pull_request' && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'mutants')) }}
        run: |
          # The shard count follows the diff's mutant count (docs/ci.md, "Mutation testing").
          # Every code pull request lists the diff's mutants, draft or not, so a
          # lane reads them before CI runs its shards; only `MUTANTS` starts shards.
          count=0
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$MODE" != docs ]; then
            git diff "$BASE...HEAD" >"$RUNNER_TEMP/diff.patch"
            cargo mutants --in-diff "$RUNNER_TEMP/diff.patch" --list --colors=never >"$RUNNER_TEMP/mutants.txt"
            {
              echo "### Mutants in the diff: $(wc -l <"$RUNNER_TEMP/mutants.txt")"
              echo '```'
              cat "$RUNNER_TEMP/mutants.txt"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            # A lane on the command line reads the log: `gh run view` prints no summaries.
            cat "$RUNNER_TEMP/mutants.txt"
            listed=$(wc -l <"$RUNNER_TEMP/mutants.txt")
            if [ "$MUTANTS" = true ]; then
              count=$listed
            fi
          fi
          if [ "$MUTANTS" != true ] && [ "${listed:-0}" -gt 0 ]; then
            echo "mutants in the diff: $listed (not run: a draft without the \`mutants\` label)"
          else
            echo "mutants in the diff: $count"
          fi
          cargo xtask plan --base "$BASE" --mode "$MODE" --packages "$PACKAGES" --event "$GITHUB_EVENT_NAME" \
            --draft "$DRAFT" --bug "$BUG" --mutants "$MUTANTS" --mutant-count "$count" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Linux x86_64 checks
    needs: select
    if: fromJSON(needs.select.outputs.jobs).lint
    runs-on: ubuntu-24.04
    # Median 55 s, slowest passing run of the last 25 69 s; the 5-minute floor covers twice it.
    timeout-minutes: 5
    env:
      BASE: ${{ needs.select.outputs.base }}
    steps:
      - *checkout-full
      - *toolchain
      - *cache-restore
      # The notices parity step in scripts/check never skips here.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny,cargo-about
      - name: scripts/check, the platform-independent checks
        run: scripts/check --base "$BASE" --shared-only
      - name: cargo-deny licences, sources and bans
        run: cargo deny check licenses sources bans
      # No install-action tool installs actionlint, so this downloads the release
      # and checks its digest (docs/ci.md, "On every pull request that changes code").
      - name: actionlint, when a workflow changed
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          if ! git diff --name-only "$BASE...HEAD" | grep -q '^\.github/workflows/'; then
            echo "no workflow file changed"
            exit 0
          fi
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: cargo-deny advisories, when Cargo.lock changed
        run: |
          if git diff --name-only "$BASE...HEAD" | grep -qx Cargo.lock; then
            cargo deny check advisories
          else
            echo "Cargo.lock is unchanged"
          fi

  # Linux x86_64 is its own job so `mutants` can wait for it alone (a job
  # cannot wait for one leg of a matrix). `test` below runs the other
  # platforms with the same steps.
  test_linux:
    name: Tests (${{ matrix.runner }})
    needs: select
    if: fromJSON(needs.select.outputs.jobs).test_linux
    strategy:
      matrix:
        runner: [ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    # Cold 16m27s with the 1.99.1 toolchain (run 39564649711 on this PR,
    # which missed every cache); the bound is twice that, rounded up
    # (docs/ci.md, "Job time limits").
    timeout-minutes: 35
    env:
      BASE: ${{ needs.select.outputs.base }}
    # Whether the leg's final list is non-empty; flake_decide downloads
    # this leg's artifact only when it is true (docs/testing.md,
    # "Flaky tests").
    outputs:
      has_flakes: ${{ steps.has_flakes.outputs.has_flakes }}
    steps: &test-steps
      - *checkout-full
      - *toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-line-tables
          save-if: ${{ github.event_name == 'push' }}
      # The cache can hold target/nextest/ci/junit.xml from an earlier run.
      # Remove it before any step can fail, so the if: always() upload below
      # only ever sees XML this run wrote.
      - name: Remove any cached JUnit XML
        run: rm -f target/nextest/ci/junit.xml
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest
      # The completion tests load `fiber completion`'s scripts in bash, zsh
      # and fish (crates/main/tests/completion.rs).
      # The archives are cached per runner image and architecture. The key
      # names the package list: change it here, in mutants-scheduled.yml and
      # in scripts/install-shells together. ImageOS and ImageVersion are not in
      # the `env` context, so a step builds the key.
      - &shell-debs-key
        name: Key the zsh and fish archive cache
        id: shell-debs-key
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: echo "key=shell-debs-${ImageOS:?}-${ImageVersion:?}-${RUNNER_ARCH:?}-zsh-fish" >> "$GITHUB_OUTPUT"
      - &shell-debs-restore
        name: Restore the zsh and fish archives
        id: shell-debs
        if: runner.os == 'Linux'
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/shell-debs
          key: ${{ steps.shell-debs-key.outputs.key }}
      - &install-shells
        name: Install zsh and fish
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          SHELL_DEBS_CACHE_HIT: ${{ steps.shell-debs.outputs.cache-hit }}
        run: |
          # A restore that fails part way can leave files behind and report no hit.
          if [ "$SHELL_DEBS_CACHE_HIT" != true ]; then
            rm -rf "$RUNNER_TEMP/shell-debs"
          fi
          scripts/install-shells "$RUNNER_TEMP/shell-debs"
      - &shell-debs-save
        name: Save the zsh and fish archives
        if: runner.os == 'Linux' && steps.shell-debs.outputs.cache-hit != 'true'
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/shell-debs
          key: ${{ steps.shell-debs-key.outputs.key }}
      - name: Install fish
        if: runner.os == 'macOS'
        run: brew install fish
      - name: Build the whole workspace
        id: build
        if: github.event_name == 'push'
        run: cargo build --workspace --all-targets
      # The save step runs after a failure only when CACHE_ON_FAILURE is
      # 'true' (rust-cache's post-if), and `with:` cannot read this step's
      # outcome: set it here, once the build succeeded, so a later failed
      # check still saves the cache and a failed build saves nothing.
      - name: Save the cache even if a later step fails
        if: steps.build.outcome == 'success'
        run: echo CACHE_ON_FAILURE=true >> "$GITHUB_ENV"
      - name: scripts/check, the per-platform checks
        # The ci profile retries a failed binary-level test once
        # (docs/ci.md, "On every pull request that changes code"). This step
        # and the hub_service step below both set it. Each run writes
        # target/nextest/ci/junit.xml, so each run's list is recorded right
        # after the run that produced it.
        env:
          NEXTEST_PROFILE: ci
        run: scripts/check --base "$BASE" --platform-only
      # The tests that passed after a retry, one per line, for the
      # flake_report job (docs/testing.md, "Flaky tests"). This records the
      # scripts/check run above; the hub_service run below overwrites the
      # JUnit XML, so its list is appended after it. Missing or empty JUnit
      # XML records nothing; the artifact is uploaded only when the file is
      # non-empty.
      - name: Record tests that passed on retry
        id: flaky
        if: always()
        env:
          LIST: ${{ runner.temp }}/flaky-tests-${{ matrix.runner }}.txt
        run: |
          scripts/flaky-tests target/nextest/ci/junit.xml > "$LIST"
          if [ -s "$LIST" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      # The full-suite scripts/check XML, captured after retry handling and
      # before the hub_service run below overwrites the file. Linux x86_64
      # only: this anchor is shared verbatim with the arm64/macOS legs.
      - name: Upload the full-suite JUnit XML
        if: always() && matrix.runner == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      # The hub's login service against systemd's user instance
      # (crates/main/tests/hub_service.rs). The runner has no user instance
      # until lingering is enabled for its user.
      - name: The hub's login service under systemd
        if: matrix.runner == 'ubuntu-24.04'
        timeout-minutes: 5
        # The ci profile retries a failed binary-level test once, as above.
        # This run overwrites target/nextest/ci/junit.xml, so the step below
        # appends its list to the same file.
        env:
          NEXTEST_PROFILE: ci
        run: |
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          state=""
          for _ in $(seq 1 30); do
            state=$(systemctl --user is-system-running 2>/dev/null || true)
            if [ "$state" = running ] || [ "$state" = degraded ]; then
              break
            fi
            sleep 1
          done
          if [ "$state" != running ] && [ "$state" != degraded ]; then
            echo "systemd's user instance is not running after 30 s: '$state'"
            exit 1
          fi
          cargo nextest run -p main --test hub_service --run-ignored only
      # The hub_service run's tests that passed after a retry, appended to
      # the same list for the flake_report job. Linux x86_64 only, like the
      # step above.
      - name: Record hub_service tests that passed on retry
        id: flaky_hub
        if: always() && matrix.runner == 'ubuntu-24.04'
        env:
          LIST: ${{ runner.temp }}/flaky-tests-${{ matrix.runner }}.txt
        run: |
          scripts/flaky-tests target/nextest/ci/junit.xml >> "$LIST"
          if [ -s "$LIST" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      # Every leg uploads its list, including an empty one, except the
      # one-leg test_linux matrix, which keeps its conditional upload:
      # an empty file is a complete empty list, so flake_decide tells it
      # apart from a missing or cancelled leg (docs/testing.md,
      # "Flaky tests").
      - name: Upload the tests that passed on retry
        if: always() && (matrix.runner != 'ubuntu-24.04' || steps.flaky.outputs.found == 'true' || steps.flaky_hub.outputs.found == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-tests-${{ matrix.runner }}
          path: ${{ runner.temp }}/flaky-tests-${{ matrix.runner }}.txt
          if-no-files-found: ignore
      # The leg's final list, after both record steps above. flake_decide
      # downloads this leg's artifact only when this output is true; a
      # missing artifact then fails that job.
      - name: Report whether this leg found flakes
        id: has_flakes
        if: always()
        env:
          LIST: ${{ runner.temp }}/flaky-tests-${{ matrix.runner }}.txt
        run: |
          if [ -s "$LIST" ]; then
            echo "has_flakes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_flakes=false" >> "$GITHUB_OUTPUT"
          fi

  # Linux arm64 and macOS. The plan decides whether it runs: a draft skips
  # it, so a draft runs Linux x86_64 only, and marking it ready runs all
  # three (docs/ci.md).
  test:
    name: Tests (${{ matrix.runner }})
    needs: select
    if: fromJSON(needs.select.outputs.jobs).test
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.runner }}
    # Cold with the 1.99.1 toolchain (run 39564649711 on this PR, which
    # missed every cache): Linux arm64 14m46s; macOS 30m38s. Each bound is
    # twice its cold figure, rounded up (docs/ci.md, "Job time limits").
    timeout-minutes: ${{ matrix.runner == 'macos-26' && 62 || 30 }}
    env:
      BASE: ${{ needs.select.outputs.base }}
    steps: *test-steps

  # Decides what the flake report writes (docs/testing.md, "Flaky tests").
  # It holds `contents: read` and `issues: read`, checks out the tested
  # commit with full history and runs no Fiber code beyond
  # `cargo xtask flake-report`: selection and the reopen/skip/create
  # decision live in xtask, and the write-only flake_report job below
  # only carries them out. Not in `ci`'s needs: a flake never fails the
  # merge.
  flake_decide:
    name: Decide flake report actions
    needs: [select, test_linux, test]
    if: always() && (fromJSON(needs.select.outputs.jobs).test_linux || fromJSON(needs.select.outputs.jobs).test)
    runs-on: ubuntu-24.04
    # No history: checkout, a cold xtask build and paginated API lookups
    # fit in this bound (docs/ci.md, "Job time limits").
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      has_flakes: ${{ steps.collate.outputs.has_flakes }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # A selected leg that never reported a list proves nothing: a
      # cancelled or skipped leg fails closed here, before any lookup.
      - name: Fail closed on a cancelled or skipped selected leg
        if: always()
        env:
          LINUX_SELECTED: ${{ fromJSON(needs.select.outputs.jobs).test_linux }}
          TEST_SELECTED: ${{ fromJSON(needs.select.outputs.jobs).test }}
          LINUX_RESULT: ${{ needs.test_linux.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$LINUX_SELECTED" = true ] && { [ "$LINUX_RESULT" = cancelled ] || [ "$LINUX_RESULT" = skipped ]; }; then
            echo "test_linux was selected but $LINUX_RESULT, so no list can prove there were no flakes"
            exit 1
          fi
          if [ "$TEST_SELECTED" = true ] && { [ "$TEST_RESULT" = cancelled ] || [ "$TEST_RESULT" = skipped ]; }; then
            echo "test was selected but $TEST_RESULT, so no list can prove there were no flakes"
            exit 1
          fi
      # The one-leg test_linux matrix uploads its list only when
      # non-empty: download it only when its output says flakes exist,
      # and a missing artifact then fails the job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: fromJSON(needs.select.outputs.jobs).test_linux && needs.test_linux.outputs.has_flakes == 'true'
        with:
          name: flaky-tests-ubuntu-24.04
          path: ${{ runner.temp }}/flaky
      # Each two-leg test matrix leg always uploads its list, including
      # an empty one: an empty file is a complete empty list, while a
      # missing artifact fails closed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: fromJSON(needs.select.outputs.jobs).test
        with:
          name: flaky-tests-ubuntu-24.04-arm
          path: ${{ runner.temp }}/flaky
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: fromJSON(needs.select.outputs.jobs).test
        with:
          name: flaky-tests-macos-26
          path: ${{ runner.temp }}/flaky
      - name: Collate this run's flake titles
        id: collate
        env:
          FLAKY_DIR: ${{ runner.temp }}/flaky
        run: |
          titles=$RUNNER_TEMP/flake-titles.txt
          : > "$titles"
          if [ -d "$FLAKY_DIR" ]; then
            for file in "$FLAKY_DIR"/flaky-tests-*.txt; do
              [ -f "$file" ] || continue
              while IFS= read -r line || [ -n "$line" ]; do
                [ -n "$line" ] || continue
                title="Flaky test: ${line%%$'\t'*}"
                grep -Fxq "$title" "$titles" || printf '%s\n' "$title" >> "$titles"
              done < "$file"
            done
          fi
          if [ -s "$titles" ]; then
            echo "has_flakes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_flakes=false" >> "$GITHUB_OUTPUT"
            echo "No test passed after a retry in this run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.collate.outputs.has_flakes == 'true'
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install the toolchain
        if: steps.collate.outputs.has_flakes == 'true'
        run: rustup toolchain install
      # Complete exact-title open and closed lookups, the selected
      # issue's complete event list and the ancestry check feed
      # `cargo xtask flake-report`, which returns one JSON-lines action
      # per unique title. A failed lookup arrives as failed/incomplete,
      # never as an empty list. Repeat titles across runner lists
      # collapse to one decision.
      - name: Look up issues and decide the report actions
        if: steps.collate.outputs.has_flakes == 'true'
        run: |
          titles=$RUNNER_TEMP/flake-titles.txt
          flakes=$(jq -R -s '{flakes: (split("\n") | map(select(length > 0)) | map({title: .}))}' "$titles")
          open_ok=true
          open_raw="[]"
          if ! open_raw=$(gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" 2>/dev/null); then
            open_ok=false
            open_raw="[]"
          fi
          if ! open_issues=$(printf '%s' "$open_raw" | jq -s 'add // [] | map({number, title} + (if .pull_request == null then {} else {pull_request: true} end))' 2>/dev/null); then
            open_ok=false
            open_issues="[]"
          fi
          closed_ok=true
          closed_raw="[]"
          if ! closed_raw=$(gh api --paginate "repos/$GH_REPO/issues?state=closed&per_page=100" 2>/dev/null); then
            closed_ok=false
            closed_raw="[]"
          fi
          if ! closed_issues=$(printf '%s' "$closed_raw" | jq -s 'add // [] | map({number, title, closed_at} + (if .pull_request == null then {} else {pull_request: true} end))' 2>/dev/null); then
            closed_ok=false
            closed_issues="[]"
          fi
          open=$(jq -n --argjson ok "$open_ok" --argjson issues "$open_issues" '{ok: $ok, issues: $issues}')
          closed=$(jq -n --argjson ok "$closed_ok" --argjson issues "$closed_issues" '{ok: $ok, issues: $issues}')
          events_all="{}"
          ancestry_all="{}"
          while IFS= read -r title || [ -n "$title" ]; do
            [ -n "$title" ] || continue
            number=$(printf '%s' "$closed_issues" | jq --arg t "$title" 'map(select(.title == $t and .pull_request == null)) | sort_by([.closed_at, .number]) | last | .number // empty')
            [ -n "$number" ] || continue
            events_ok=true
            events_raw="[]"
            if ! events_raw=$(gh api --paginate "repos/$GH_REPO/issues/$number/events" 2>/dev/null); then
              events_ok=false
              events_raw="[]"
            fi
            if ! events=$(printf '%s' "$events_raw" | jq -s 'add // [] | map({event, id, commit_id, created_at})' 2>/dev/null); then
              events_ok=false
              events="[]"
            fi
            events_all=$(printf '%s' "$events_all" | jq --arg n "$number" --argjson ok "$events_ok" --argjson e "$events" '. + {($n): {ok: $ok, events: $e}}')
            fixes=$(printf '%s' "$events" | jq -r '[.[] | select(.event == "closed" and .commit_id != null) | .commit_id] | unique | .[]')
            for fix in $fixes; do
              if git cat-file -e "$fix" 2>/dev/null && git merge-base --is-ancestor "$fix" "$GITHUB_SHA" 2>/dev/null; then
                holds=true
              elif git cat-file -e "$fix" 2>/dev/null; then
                holds=false
              else
                continue
              fi
              ancestry_all=$(printf '%s' "$ancestry_all" | jq --arg f "$fix" --argjson h "$holds" '. + {($f): $h}')
            done
          done < "$titles"
          jq -n --argjson flakes "$flakes" --argjson open "$open" --argjson closed "$closed" --argjson events "$events_all" --argjson ancestry "$ancestry_all" '{flakes: $flakes.flakes, open: $open, closed: $closed, events: $events, ancestry: $ancestry}' > "$RUNNER_TEMP/flake-input.json"
          cargo xtask flake-report < "$RUNNER_TEMP/flake-input.json" > "$RUNNER_TEMP/flake-decisions.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.collate.outputs.has_flakes == 'true'
        with:
          name: flake-decisions
          path: ${{ runner.temp }}/flake-decisions.jsonl
          if-no-files-found: error

  mutants:
    name: Mutants (shard ${{ matrix.shard }})
    needs: [select, test_linux]
    if: fromJSON(needs.select.outputs.jobs).mutants
    strategy:
      fail-fast: false
      matrix:
        # A skipped job still needs a non-empty matrix.
        shard: ${{ fromJSON(needs.select.outputs.shard_total) > 0 && fromJSON(needs.select.outputs.shards) || fromJSON('[0]') }}
    runs-on: ubuntu-24.04
    # A shard of up to 15 mutants gets 40 minutes; a larger shard, which only
    # the 16-shard cap makes, gets 40 minutes per 15 of its mutants, rounded
    # up, at most 360 minutes, GitHub's limit for a job. The selection
    # computes it (`cargo xtask plan`).
    timeout-minutes: ${{ fromJSON(needs.select.outputs.shard_timeout || '40') }}
    env:
      BASE: ${{ needs.select.outputs.base }}
      SHARD: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ needs.select.outputs.shard_total }}
    steps:
      - *checkout-full
      - *toolchain
      - *cache-restore
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-mutants,cargo-nextest
      # The completion tests load `fiber completion`'s scripts in bash, zsh
      # and fish (crates/main/tests/completion.rs).
      - *shell-debs-key
      - *shell-debs-restore
      - *install-shells
      - *shell-debs-save
      - name: cargo mutants --in-diff
        run: |
          git diff "$BASE...HEAD" >"$RUNNER_TEMP/diff.patch"
          mutant_list="$RUNNER_TEMP/mutants-$SHARD.txt"
          cargo mutants --in-diff "$RUNNER_TEMP/diff.patch" --shard "$SHARD/$SHARD_TOTAL" --sharding round-robin --list >"$mutant_list"
          # A shard with no mutants of its own stops here.
          if [ ! -s "$mutant_list" ]; then
            echo "no mutants in shard $SHARD"
            exit 0
          fi
          cat "$mutant_list"
          # The Linux x86_64 tests passed on this head before the shard
          # started, so the baseline run adds nothing (docs/ci.md).
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          state=""
          for _ in $(seq 1 30); do
            state=$(systemctl --user is-system-running 2>/dev/null || true)
            if [ "$state" = running ] || [ "$state" = degraded ]; then
              break
            fi
            sleep 1
          done
          if [ "$state" != running ] && [ "$state" != degraded ]; then
            echo "systemd's user instance is not running after 30 s: '$state'"
            exit 1
          fi
          mutant_args=(
            --in-diff "$RUNNER_TEMP/diff.patch"
            --test-tool nextest
            --baseline=skip
            # Recent mutants take 13 to 27 s; 120 s leaves room for test deadlines (docs/ci.md).
            --timeout 120
            --shard "$SHARD/$SHARD_TOTAL"
            --sharding round-robin
          )
          # 12 GiB is ample above a normal nextest run and leaves 4 GiB of the 16 GiB runner for the host.
          # OOMPolicy=kill fails the whole scope instead of letting nextest count a killed test as caught.
          if systemd-run --user --scope -p MemoryMax=12G -p OOMPolicy=kill -- cargo mutants "${mutant_args[@]}"; then
            :
          else
            status=$?
            last_log=$(find mutants.out/log -type f -name '*.log' -printf '%T@ %p\n' 2>/dev/null \
              | sort -nr | head -n 1 | cut -d' ' -f2- || true)
            echo "cargo mutants failed with status $status; last mutant:"
            if [ -n "$last_log" ]; then
              awk 'NF { print; exit }' "$last_log"
            else
              echo "No scenario log found in mutants.out/log."
            fi
            exit "$status"
          fi
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore

  bug_red:
    name: Bug fix fails at the red commit
    needs: select
    if: fromJSON(needs.select.outputs.jobs).bug_red
    runs-on: ubuntu-24.04
    # One run, 3 min; the slowest passing run of the last 25 took 3.5 min; 10 minutes covers twice it.
    timeout-minutes: 10
    env:
      BASE: ${{ needs.select.outputs.base }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - *checkout-full
      - *toolchain
      - *cache-restore
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest
      - run: scripts/bug-red "$BASE" "$HEAD_SHA"

  release:
    name: Release build and size (Linux x86_64)
    needs: select
    if: fromJSON(needs.select.outputs.jobs).release
    runs-on: ubuntu-24.04
    # Cold PR probe 39863819671 missed both the Rust and base-binary caches;
    # the full Release job, including the debug pass, took 34m01. Warm
    # baseline run 39805368958 took 22m47. Final timeout validation run
    # 39871492786 passed with both caches hit and took 31m21. Twice the cold
    # time is 68m02, rounded up to 69m (docs/ci.md, "Job time limits"). Push
    # runs keep 60m; the ruling says to report rather than raise it.
    timeout-minutes: ${{ github.event_name == 'push' && 60 || 69 }}
    # The stored-results lookup lists another run's artifact, which needs
    # `actions: read` beyond the workflow's `contents: read`.
    permissions:
      contents: read
      actions: read
    env:
      BASE: ${{ needs.select.outputs.base }}
      # C code (lua-src, ring) compiles against musl's headers; the Rust linker stays the default.
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      # The pull request's head, not the merge commit, so the head and base
      # binaries are the two ends of the diff the selection measured.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - *toolchain
      - name: Install the musl target and C compiler
        # A mirror that stops answering must fail the step, not hold the job to its bound.
        timeout-minutes: 5
        run: |
          rustup target add x86_64-unknown-linux-musl
          # shellcheck disable=SC2086 # APT_OPTS is a list of options
          sudo apt-get $APT_OPTS update
          # shellcheck disable=SC2086 # APT_OPTS is a list of options
          sudo apt-get $APT_OPTS install -y --no-install-recommends musl-tools time
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release
          save-if: ${{ github.event_name == 'push' }}
      - name: Find the base commit
        if: github.event_name == 'pull_request'
        id: base
        run: |
          commit=$(git merge-base "$BASE" HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          # The base's nearest first-parent ancestors, nearest first: the
          # stored binaries a base that does not build falls back to. The
          # cache service takes 10 keys, so the base's own and 9 of these.
          {
            echo "ancestors<<EOF"
            git rev-list --first-parent --skip=1 -n 9 "$commit" | sed 's/^/release-musl-/'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # The base's own key first, then its ancestors' in order, each a full
      # commit hash, so a prefix match is an exact one and the nearest stored
      # ancestor wins. cache-hit is true only for the base's own key;
      # cache-matched-key names the key that matched.
      - name: Restore the base binary the backstop stored
        if: github.event_name == 'pull_request'
        id: stored
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release/cache
          key: release-musl-${{ steps.base.outputs.commit }}
          restore-keys: ${{ steps.base.outputs.ancestors }}
      - name: scripts/release-size
        env:
          BASE_COMMIT: ${{ steps.base.outputs.commit }}
          BASE_CACHED: ${{ steps.stored.outputs.cache-hit }}
          BASE_MATCHED_KEY: ${{ steps.stored.outputs.cache-matched-key }}
        run: scripts/release-size "$BASE_COMMIT"
      # The paging rows' jig, built for the target that ships; a base without
      # one leaves its paging timings unavailable. Its base is the commit
      # scripts/release-size compared against.
      - name: Build the paging jig
        run: scripts/paging-jig
      # Only the backstop saves, so a pull request's base comes from main.
      - name: Store this commit's binary
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release/cache
          key: release-musl-${{ github.sha }}
      # docs/performance.md, "Measuring". The harness is built in the debug
      # profile; nothing it builds ships.
      - name: Build the benchmark harness
        run: cargo build -p bench --example bench
      # fsyncs are the fdatasync calls strace counts (docs/performance.md,
      # "Measuring"); a runner without strace fails here.
      - name: Install strace
        timeout-minutes: 5
        run: |
          if ! command -v strace > /dev/null; then
            apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
            sudo apt-get "${apt_opts[@]}" update
            sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends strace
          fi
          strace -V
      - name: Run the benchmarks
        env:
          BASE_SKIP: ${{ needs.select.outputs.base_skip }}
        run: |
          out=$RUNNER_TEMP/bench
          mkdir -p "$out"
          harness=target/debug/examples/bench
          # A pull request measures its timing-only workloads and the
          # `paging` jig 3 times and the rest 5 times; a push measures
          # every workload 5 times.
          runs=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            runs=(--timing-runs 3)
          fi
          # A pull request runs the 10-busy-turns workload only when its
          # diff touches what the workload measures; a push always runs it
          # (docs/ci.md, "Selection").
          ten_turns=()
          if [ "${{ needs.select.outputs.ten_turns }}" != true ]; then
            ten_turns=(--skip-ten-turns)
          fi
          # A pull request measures the head and base binaries' timing
          # samples in alternation inside one harness run: the base runs
          # only the timing benchmarks the selection chooses, named by
          # base_skip, in the same job on the same runner, so a timing
          # comparison never crosses runners. Memory and exact rows compare
          # against the backstop's stored results, looked up
          # by scripts/stored-results. A base that does not build and has
          # no stored ancestor leaves no base binary (scripts/release-size):
          # its timings are skipped, and bench-report shows the missing
          # base file. A base run that writes no file is reported by
          # bench-report, not here.
          base_flags=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -f "$RUNNER_TEMP/release/base/fiber" ]; then
            base_flags=(--base-fiber "$RUNNER_TEMP/release/base/fiber" --base-out "$out/base.json" --skip-rows "$BASE_SKIP")
            if [ -f "$RUNNER_TEMP/release/base/paging" ]; then
              base_flags+=(--base-paging "$RUNNER_TEMP/release/base/paging")
            fi
          fi
          start=$SECONDS
          "$harness" --fiber "$RUNNER_TEMP/release/head/fiber" --out "$out/head.json" --only all \
            "${runs[@]}" \
            "${ten_turns[@]}" \
            --paging "$RUNNER_TEMP/release/head/paging" \
            "${base_flags[@]}"
          echo "bench wall time: $((SECONDS - start)) s"
      - name: Print the attach stages
        run: |
          table=$(jq -r '
            (.metrics.attach_stage_ms // []) as $rows
            | if ($rows | length) == 0 then
              "No attach stages recorded."
            else
              (def median: if length == 0 then null else sort | .[(length / 2) | floor] end;
               def show: if . == null then "n/a" else ((. * 10 | round / 10) | tostring) end;
               def med(f; s): [$rows[] | select(.fixture == f and .stage == s) | .ms] | median;
               ["## Attach stages", "",
                "| Fixture | terminal | hub_replay | parse | fold | frames_1 | frames_4096 | frames_64 | residual |",
                "|---|---|---|---|---|---|---|---|---|"]
               + (["1 MiB", "10 MiB"] | map(
                 . as $f
                 | (med($f; "terminal")) as $t
                 | (med($f; "hub_replay")) as $h
                 | (med($f; "parse")) as $p
                 | (med($f; "fold")) as $fo
                 | (med($f; "frames_1")) as $f1
                 | (med($f; "frames_4096")) as $f4096
                 | (med($f; "frames_64")) as $f64
                 | (if [$t, $h, $p, $fo, $f1] | any(. == null) then "n/a"
                    else ([$t, $h, $p, $fo, $f1] | (.[0] - .[1] - .[2] - .[3] - .[4]) | show) end) as $r
                 | "| \($f) | \($t | show) | \($h | show) | \($p | show) | \($fo | show)" +
                   " | \($f1 | show) | \($f4096 | show) | \($f64 | show) | \($r) |"
               ))
               | join("\n"))
            end
          ' "$RUNNER_TEMP/bench/head.json")
          echo "$table"
          echo "$table" >> "$GITHUB_STEP_SUMMARY"
      - name: Look up the base's stored results
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_COMMIT: ${{ steps.base.outputs.commit }}
        run: scripts/stored-results "$BASE_COMMIT"
      - name: Judge the benchmarks against docs/performance.md
        id: report
        run: |
          out=$RUNNER_TEMP/bench
          args=(--head "$out/head.json" --doc docs/performance.md --event "$GITHUB_EVENT_NAME"
            --comment "$out/bench-comment.md")
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            args+=(--base "$out/base.json")
            if [ -f "$RUNNER_TEMP/release/base/commit" ]; then
              args+=(--base-commit "$(git rev-parse --short "$(cat "$RUNNER_TEMP/release/base/commit")")")
            fi
            if [ -f "$RUNNER_TEMP/stored/commit" ]; then
              args+=(--stored-base "$RUNNER_TEMP/stored/head.json"
                --stored-commit "$(git rev-parse --short "$(cat "$RUNNER_TEMP/stored/commit")")")
            fi
          fi
          status=0
          cargo xtask bench-report "${args[@]}" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # A fork's pull request gets no comment; the run's summary carries it.
          if [ -f "$out/bench-comment.md" ]; then
            cat "$out/bench-comment.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      # The backstop's files are the history a timing gate is later set from.
      - name: Upload the benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/bench/
          retention-days: 90
          overwrite: true
      - name: Fail on an exceeded budget or a failed self-check
        env:
          STATUS: ${{ steps.report.outputs.status }}
        run: exit "$STATUS"

  backstop_report:
    name: Report a failed backstop
    needs: [select, lint, test_linux, test, mutants, release]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    # No history: it makes only gh calls.
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Backstop failed on main
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          body="The backstop failed at $GITHUB_SHA: $RUN_URL"
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            -q "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

  # Deletes the cache entries the backstop's save replaced and the release
  # binaries no pull request's base can reach (scripts/cache-prune). It holds
  # the only `actions: write` token and runs only the script. Not in `ci`'s
  # needs: a failed prune leaves the cache larger, and the next backstop retries.
  cache_prune:
    name: Prune the build cache
    needs: [test_linux, test, release]
    if: always() && github.event_name == 'push' && needs.test_linux.result == 'success' && needs.test.result == 'success' && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    # No build: it makes only git and gh calls.
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - *checkout-full
      - run: scripts/cache-prune

  # Posts the release job's benchmark comment. It holds a write token, so it
  # checks nothing out and runs no repository code: the comment comes from
  # this run's artifact and goes to the API by file. A fork's token is
  # read-only, so a fork's pull request is skipped. Not in `ci`'s needs: the
  # comment is advisory, and the budgets' verdict is the release job's.
  bench_comment:
    name: Benchmark comment
    needs: release
    if: >-
      always() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    # No history: it makes only gh calls.
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmarks-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/bench
      - name: Post or replace the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body=$RUNNER_TEMP/bench/bench-comment.md
          comments=repos/$GITHUB_REPOSITORY/issues/$PR/comments
          # The job's comments are github-actions[bot]'s whose first line is the
          # marker; a copy by anyone else is never edited or deleted.
          ids=$(gh api --paginate "$comments" --jq '.[]
            | select(.user.login == "github-actions[bot]"
              and (.body | split("\n")[0]) == "<!-- fiber-benchmarks -->")
            | .id' | sort -n)
          if [ -z "$ids" ]; then
            gh api -X POST "$comments" -F body=@"$body" --silent
            exit 0
          fi
          # The oldest is edited in place; a duplicate from two concurrent
          # runs is deleted.
          first=$(head -n 1 <<<"$ids")
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$first" -F body=@"$body" --silent
          for id in $(tail -n +2 <<<"$ids"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id" --silent
          done

  # Files the flake issues for the tests that passed after a retry
  # (docs/testing.md, "Flaky tests"). It holds `contents: read`,
  # `pull-requests: write` and `issues: write`, checks nothing out and runs
  # no repository code: the test names come from this run's artifacts, the
  # reopen/skip/create decision comes from flake_decide's JSON-lines
  # artifact, and both go to the API by file. It skips repeat titles,
  # stale bases and PR-only failures. One report writes at a time:
  # `queue: max` serialises runs, and GitHub cancels a new report past
  # its 100 pending reports (docs/ci.md). Not in `ci`'s needs: a flake
  # never fails the merge.
  flake_report:
    name: Report flaky tests
    needs: [flake_decide]
    if: always() && (needs.flake_decide.result == 'failure' || needs.flake_decide.outputs.has_flakes == 'true')
    runs-on: ubuntu-24.04
    # No history: it makes only gh calls.
    timeout-minutes: 5
    concurrency:
      group: flake-report
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # The decision artifact is required: without flake_decide's
      # JSON-lines actions there is no reopen, skip or create, and no old
      # create path runs as fallback. A missing artifact fails the job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flake-decisions
          path: ${{ runner.temp }}/decisions
      # The test job uploads one artifact per runner only when a test
      # passed after a retry there; with none, there is nothing to
      # download, and download-artifact fails on an empty match, so count
      # first. One API call, no loop (docs/ci.md, "Waiting on CI").
      - name: Count this run's flake lists
        id: lists
        run: |
          count=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" \
            -q '[.artifacts[] | select(.name | startswith("flaky-tests-"))] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.lists.outputs.count != '0'
        with:
          pattern: flaky-tests-*
          merge-multiple: true
          path: ${{ runner.temp }}/flaky
      - name: File or comment on the flake issues
        if: always()
        env:
          PR: ${{ github.event.pull_request.number }}
          DECIDE_RESULT: ${{ needs.flake_decide.result }}
          DECIDE_FLAKES: ${{ needs.flake_decide.outputs.has_flakes }}
          DECISIONS: ${{ runner.temp }}/decisions/flake-decisions.jsonl
        run: |
          # Fail closed before any write: the decision job must have
          # succeeded with flakes, and its JSON-lines artifact must be
          # present. No old create path runs as fallback.
          if [ "${DECIDE_RESULT:-}" != success ] || [ "${DECIDE_FLAKES:-}" != true ]; then
            echo "flake_decide did not decide flakes (result ${DECIDE_RESULT:-missing}, has_flakes ${DECIDE_FLAKES:-missing}): no write" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ ! -f "${DECISIONS:-}" ]; then
            echo "the flake-decisions artifact is missing: no write" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          dir=$RUNNER_TEMP/flaky
          if [ ! -d "$dir" ]; then
            echo "flake_decide found flakes but their lists are missing: no write" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          seen=$RUNNER_TEMP/flaky-seen.txt
          : > "$seen"
          base=""
          head_sha=""
          compare_files=""
          pr_files=""
          if [ "${GITHUB_EVENT_NAME:-}" = pull_request ]; then
            # A pull request's merge commit has main as parents[0] and the
            # pull request head as parents[1].
            parents=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" -q '[.parents[].sha] | join(" ")' || true)
            read -r base head_sha <<< "$parents" || true
            if [ -n "$base" ]; then
              compare_files=$(gh api --paginate "repos/$GH_REPO/compare/$base...main" -q '.files[].filename' || true)
            fi
            if [ -n "$PR" ]; then
              pr_files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files" -q '.[].filename' || true)
            fi
          fi
          # The tested commit, named in every body this step writes
          # (docs/testing/running.md, "Flaky tests").
          tested="tested $GITHUB_SHA"
          if [ -n "$base" ] && [ -n "$head_sha" ]; then
            tested="tested $GITHUB_SHA = main $base + head $head_sha"
          fi
          # The one body construction for the issue, the sighting comment
          # and the pull request comment: the sentence, the tested commit,
          # then the failure text in a fence when there is any.
          flake_body() {
            printf '%s\n%s' "$1" "$tested"
            if [ -n "$detail" ]; then
              printf "\n\`\`\`\n%s\n\`\`\`" "$detail"
            fi
          }
          # The first open issue with exactly this title, never a pull
          # request. Prints the number or nothing; fails on failed or
          # incomplete data.
          open_number() {
            raw=$(gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" 2>/dev/null) || return 1
            printf '%s' "$raw" | jq -r -s --arg t "$1" 'add // [] | map(select(.title == $t and .pull_request == null)) | .[0].number // empty' 2>/dev/null || return 1
          }
          for file in "$dir"/flaky-tests-*.txt; do
            [ -f "$file" ] || continue
            runner=${file#"$dir"/flaky-tests-}
            runner=${runner%.txt}
            while IFS= read -r line || [ -n "$line" ]; do
              [ -n "$line" ] || continue
              # The test, then a TAB, then its first failure; a line with no
              # tab has empty detail. Quoted throughout: data only, never eval.
              name=${line%%$'\t'*}
              case "$line" in
                *$'\t'*) detail=${line#*$'\t'} ;;
                *) detail="" ;;
              esac
              title="Flaky test: $name"
              if grep -Fxq "$title" "$seen"; then
                continue
              fi
              failing=""
              case "$detail" in
                *panicked\ at*)
                  hit=$(printf '%s' "$detail" | grep -o -E '[A-Za-z0-9_./-]+\.rs:[0-9]+' | head -n 1 || true)
                  if [ -n "$hit" ]; then
                    failing=${hit%:*}
                  fi
                  ;;
              esac
              if [ -n "$failing" ] && [ "${GITHUB_EVENT_NAME:-}" = pull_request ]; then
                if [ -n "$base" ] && [ -n "$compare_files" ] \
                  && printf '%s\n' "$compare_files" | grep -Fxq "$failing"; then
                  echo "stale base: main changed $failing since $base" >> "$GITHUB_STEP_SUMMARY"
                  printf '%s\n' "$title" >> "$seen"
                  continue
                fi
                if [ -n "$pr_files" ] && printf '%s\n' "$pr_files" | grep -Fxq "$failing"; then
                  pr_body=$(flake_body "The test \`$name\` passed after a retry on $runner, but its failing file \`$failing\` belongs to #$PR rather than main: $RUN_URL.")
                  gh issue comment "$PR" --body "$pr_body"
                  printf '%s\n' "$title" >> "$seen"
                  continue
                fi
              fi
              text="The test \`$name\` passed after a retry on $runner: $RUN_URL."
              if [ -n "$PR" ]; then
                text="$text (see #$PR)"
              fi
              body=$(flake_body "$text")
              # The complete paginated open lookup: exact title, never a
              # pull request. Failed or incomplete data files nothing.
              if number=$(open_number "$title"); then
                if [ -n "$number" ]; then
                  gh issue comment "$number" --body "$body"
                  printf '%s\n' "$title" >> "$seen"
                  continue
                fi
              else
                echo "unknown open lookup: the open-issue search for $title failed, so nothing is filed" >> "$GITHUB_STEP_SUMMARY"
                printf '%s\n' "$title" >> "$seen"
                continue
              fi
              # No open issue: the decision job's one action whose title
              # exactly equals this run's title. Anything else files
              # nothing and is noted in the summary.
              action=$(jq -c --arg t "$title" 'select(.title == $t)' "$DECISIONS" 2>/dev/null || true)
              action_lines=$(printf '%s' "$action" | grep -c . || true)
              action_name=""
              action_issue=""
              if [ "$action_lines" = 1 ]; then
                action_name=$(printf '%s' "$action" | jq -r '.action // empty' 2>/dev/null || true)
                action_issue=$(printf '%s' "$action" | jq -r '.issue // empty' 2>/dev/null || true)
              fi
              case "$action_name" in
                reopen)
                  if ! printf '%s' "$action_issue" | grep -Eq '^[0-9]+$'; then
                    echo "invalid decision for $title: no write" >> "$GITHUB_STEP_SUMMARY"
                    printf '%s\n' "$title" >> "$seen"
                    continue
                  fi
                  # Validate only the ruled reopen predicates: not a
                  # pull request, closed, this run's exact title and the
                  # flake label.
                  if ! fetched=$(gh api "repos/$GH_REPO/issues/$action_issue" 2>/dev/null); then
                    echo "unknown reopen target: issue $action_issue could not be fetched, so $title stays closed" >> "$GITHUB_STEP_SUMMARY"
                    printf '%s\n' "$title" >> "$seen"
                    continue
                  fi
                  if ! printf '%s' "$fetched" | jq -e --arg t "$title" '.pull_request == null and .state == "closed" and .title == $t and ([.labels[].name] | index("test-only") != null)' >/dev/null 2>&1; then
                    echo "validation mismatch: issue $action_issue is not a closed test-only issue titled $title, so nothing is filed" >> "$GITHUB_STEP_SUMMARY"
                    printf '%s\n' "$title" >> "$seen"
                    continue
                  fi
                  # Recheck the open titles immediately before the
                  # write: another run may have filed since the lookup.
                  if number=$(open_number "$title"); then
                    if [ -n "$number" ]; then
                      echo "an open issue for $title appeared before the reopen, so nothing is filed" >> "$GITHUB_STEP_SUMMARY"
                      printf '%s\n' "$title" >> "$seen"
                      continue
                    fi
                  else
                    echo "unknown open lookup: the recheck for $title failed, so nothing is filed" >> "$GITHUB_STEP_SUMMARY"
                    printf '%s\n' "$title" >> "$seen"
                    continue
                  fi
                  gh issue reopen "$action_issue"
                  gh issue comment "$action_issue" --body "$body"
                  gh issue edit "$action_issue" --add-label needs-triage
                  ;;
                file-new)
                  if number=$(open_number "$title"); then
                    if [ -n "$number" ]; then
                      echo "an open issue for $title appeared before the create, so nothing is filed" >> "$GITHUB_STEP_SUMMARY"
                      printf '%s\n' "$title" >> "$seen"
                      continue
                    fi
                  else
                    echo "unknown open lookup: the recheck for $title failed, so nothing is filed" >> "$GITHUB_STEP_SUMMARY"
                    printf '%s\n' "$title" >> "$seen"
                    continue
                  fi
                  gh issue create --title "$title" --body "$body" --label test-only
                  ;;
                stale)
                  echo "stale fix: $title stays closed: its fix is not in the tested commit" >> "$GITHUB_STEP_SUMMARY"
                  ;;
                unknown)
                  echo "unknown fix: $title stays closed: a lookup failed, so nothing is filed" >> "$GITHUB_STEP_SUMMARY"
                  ;;
                *)
                  echo "invalid decision for $title: no write" >> "$GITHUB_STEP_SUMMARY"
                  ;;
              esac
              printf '%s\n' "$title" >> "$seen"
            done < "$file"
          done

  ci:
    # On a draft the required `CI` check stays pending, so a draft's partial run never satisfies it.
    name: ${{ github.event.pull_request.draft && 'CI (draft)' || 'CI' }}
    needs: [select, lint, test_linux, test, mutants, bug_red, release]
    if: always()
    runs-on: ubuntu-24.04
    # Median 46 s; floor.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *toolchain
      - *cache-restore
      - name: Every selected job passed and every other job was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
          JOBS: ${{ needs.select.outputs.jobs }}
        run: cargo xtask verdict
