name: Allocator comparison

# Measures the attach timing, the attach peak and both retained rows
# (research/allocator/README.md) on three builds of one commit: the musl
# release binary with its system allocator, the same build with mimalloc
# as the global allocator, and a x86_64-unknown-linux-gnu release build
# (glibc's allocator). A fourth result reruns the musl-mimalloc binary
# through a shell wrapper exporting MIMALLOC_PURGE_DELAY=0, with no new
# build. Manual only: `gh workflow run
# allocator-compare.yml --ref <branch>`, never on a push or a pull
# request. Its numbers are a comparison, not budget evidence: the budgets
# are judged by the Release job (docs/ci.md, "On every pull request that
# changes code").

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Every apt-get call retries and gives up on a silent mirror (ci.yml).
  APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20

defaults:
  run:
    shell: bash

jobs:
  compare:
    runs-on: ubuntu-24.04
    # Three release builds with LTO plus three full five-sample benchmark
    # runs: far above the Release job's 7 warm minutes for one build and
    # two runs, so the bound is set high until 20 runs show a median.
    timeout-minutes: 120
    env:
      # C code (lua-src, ring, mimalloc) compiles against musl's headers
      # (ci.yml's Release job).
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain and both targets
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl x86_64-unknown-linux-gnu

      - name: Install the C compiler and strace
        # A mirror that stops answering must fail the step, not hold the job to its bound.
        # strace is what the fsyncs workload counts (docs/performance.md, "Measuring").
        timeout-minutes: 5
        run: |
          # shellcheck disable=SC2086 # APT_OPTS is a list of options
          sudo apt-get $APT_OPTS update
          # shellcheck disable=SC2086 # APT_OPTS is a list of options
          sudo apt-get $APT_OPTS install -y --no-install-recommends musl-tools strace
          strace -V

      # The harness is built in the debug profile, as the Release job builds it.
      - name: Build the benchmark harness
        run: cargo build -p bench --example bench

      - name: Build the musl system-allocator binaries
        run: |
          target=x86_64-unknown-linux-musl
          cargo build --release --locked --target "$target" --bin fiber
          cargo build --release --locked --target "$target" -p tui --example paging
          mkdir -p "$RUNNER_TEMP/allocator/musl-system"
          cp "target/$target/release/fiber" "$RUNNER_TEMP/allocator/musl-system/fiber"
          cp "target/$target/release/examples/paging" "$RUNNER_TEMP/allocator/musl-system/paging"

      # The allocator patch lives in this job alone: it is never committed,
      # and no committed Cargo.toml names mimalloc (docs/dependencies.md).
      - name: Build the musl mimalloc binaries
        run: |
          target=x86_64-unknown-linux-musl
          cargo add mimalloc@0.1 -p main
          cat >> crates/main/src/main.rs <<'EOF'

          #[cfg(fiber_mimalloc)]
          #[global_allocator]
          static GLOBAL: mimalloc::MiMalloc = mimalloc::MiMalloc;
          EOF
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS="--cfg fiber_mimalloc" \
            cargo build --release --locked --target "$target" --bin fiber
          cargo build --release --locked --target "$target" -p tui --example paging
          mkdir -p "$RUNNER_TEMP/allocator/musl-mimalloc"
          cp "target/$target/release/fiber" "$RUNNER_TEMP/allocator/musl-mimalloc/fiber"
          cp "target/$target/release/examples/paging" "$RUNNER_TEMP/allocator/musl-mimalloc/paging"
          cargo tree -p main --prefix none -i mimalloc | head -n 1 > "$RUNNER_TEMP/allocator/mimalloc-version.txt" || true
          git checkout -- crates/main/Cargo.toml crates/main/src/main.rs Cargo.lock

      - name: Build the gnu binaries
        run: |
          target=x86_64-unknown-linux-gnu
          cargo build --release --locked --target "$target" --bin fiber
          cargo build --release --locked --target "$target" -p tui --example paging
          mkdir -p "$RUNNER_TEMP/allocator/gnu"
          cp "target/$target/release/fiber" "$RUNNER_TEMP/allocator/gnu/fiber"
          cp "target/$target/release/examples/paging" "$RUNNER_TEMP/allocator/gnu/paging"

      # The full harness, five samples each: the attach rows keep their
      # paging-jig stages, and the comparison reads the attach timing, the
      # attach peak and both retained rows out of each file. The fourth
      # result reruns the musl-mimalloc binary through a wrapper exporting
      # MIMALLOC_PURGE_DELAY=0, forwarding every argument unchanged, with
      # the same harness invocation on the same runner and commit.
      - name: Run the benchmarks on each build
        run: |
          harness=target/debug/examples/bench
          for build in musl-system musl-mimalloc gnu; do
            "$harness" --fiber "$RUNNER_TEMP/allocator/$build/fiber" \
              --paging "$RUNNER_TEMP/allocator/$build/paging" \
              --out "$RUNNER_TEMP/allocator/$build.json" --only all --runs 5
          done
          real="$RUNNER_TEMP/allocator/musl-mimalloc/fiber"
          wrapper="$RUNNER_TEMP/allocator/musl-mimalloc-purge0-fiber"
          printf '#!/bin/bash\nexport MIMALLOC_PURGE_DELAY=0\nexec "%s" "$@"\n' "$real" > "$wrapper"
          chmod +x "$wrapper"
          "$harness" --fiber "$wrapper" \
            --paging "$RUNNER_TEMP/allocator/musl-mimalloc/paging" \
            --out "$RUNNER_TEMP/allocator/musl-mimalloc-purge0.json" --only all --runs 5
          {
            echo "commit: $(git rev-parse HEAD)"
            echo "runner: ubuntu-24.04"
            echo -n "mimalloc: "
            cat "$RUNNER_TEMP/allocator/mimalloc-version.txt"
          } > "$RUNNER_TEMP/allocator/build-notes.txt"
          cat "$RUNNER_TEMP/allocator/build-notes.txt"

      - name: Print the compared medians
        run: |
          for file in "$RUNNER_TEMP/allocator/musl-system.json" \
            "$RUNNER_TEMP/allocator/musl-mimalloc.json" \
            "$RUNNER_TEMP/allocator/musl-mimalloc-purge0.json" \
            "$RUNNER_TEMP/allocator/gnu.json"; do
            if [ "$(jq '(.failures // []) | length > 0' "$file")" = "true" ]; then
              echo "benchmark failures in $file:"
              jq -r '.failures[]' "$file"
              exit 1
            fi
            for id in terminal_attach_rss_kib terminal_attach_retained_kib \
              busy_turn_retained_kib; do
              count=$(jq --arg id "$id" '(.metrics[$id] // []) | length' "$file")
              if [ "$count" -lt 5 ]; then
                echo "$file: $id has $count samples, need 5"
                exit 1
              fi
            done
            count=$(jq '[.metrics.terminal_attach_ms[]? | select(.fixture == "10 MiB")] | length' "$file")
            if [ "$count" -lt 5 ]; then
              echo "$file: terminal_attach_ms for 10 MiB has $count samples, need 5"
              exit 1
            fi
          done
          table=$(jq -r '
            def median: if length == 0 then null else sort | .[(length / 2) | floor] end;
            def show: ((. * 10 | round / 10) | tostring);
            def med(build; id): (build[0].metrics[id] // []) | median;
            def attach(build): [(build[0].metrics.terminal_attach_ms // [])[]
              | select(.fixture == "10 MiB") | .ms] | median;
            ["## Allocator comparison (medians of 5)", "",
             "| Row | musl system | musl + mimalloc | musl + mimalloc, purge delay 0 | gnu |",
             "|---|---|---|---|---|",
             "| attach 10 MiB terminal ms | \(attach($system) | show) | \(attach($mimalloc) | show) | \(attach($purge0) | show) | \(attach($gnu) | show) |",
             "| attach peak RSS KiB | \(med($system; "terminal_attach_rss_kib") | show) | \(med($mimalloc; "terminal_attach_rss_kib") | show) | \(med($purge0; "terminal_attach_rss_kib") | show) | \(med($gnu; "terminal_attach_rss_kib") | show) |",
             "| attach retained RssAnon KiB | \(med($system; "terminal_attach_retained_kib") | show) | \(med($mimalloc; "terminal_attach_retained_kib") | show) | \(med($purge0; "terminal_attach_retained_kib") | show) | \(med($gnu; "terminal_attach_retained_kib") | show) |",
             "| busy turn retained RssAnon KiB | \(med($system; "busy_turn_retained_kib") | show) | \(med($mimalloc; "busy_turn_retained_kib") | show) | \(med($purge0; "busy_turn_retained_kib") | show) | \(med($gnu; "busy_turn_retained_kib") | show) |"]
            | join("\n")
          ' --slurpfile system "$RUNNER_TEMP/allocator/musl-system.json" \
            --slurpfile mimalloc "$RUNNER_TEMP/allocator/musl-mimalloc.json" \
            --slurpfile purge0 "$RUNNER_TEMP/allocator/musl-mimalloc-purge0.json" \
            --slurpfile gnu "$RUNNER_TEMP/allocator/gnu.json" \
            <<< '{}')
          echo "$table"
          echo "$table" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allocator-compare-${{ github.sha }}
          path: ${{ runner.temp }}/allocator/
          if-no-files-found: error
